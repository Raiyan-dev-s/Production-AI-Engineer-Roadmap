<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode AI Models</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.5rem; background: linear-gradient(90deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .subtitle { color: #8892b0; font-size: 1.1rem; }
        .stats { display: flex; justify-content: center; gap: 30px; margin: 30px 0; }
        .stat-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px 30px; text-align: center; }
        .stat-number { font-size: 2rem; font-weight: 700; color: #00d2ff; }
        .stat-label { color: #8892b0; font-size: 0.9rem; margin-top: 5px; }
        .search-box { width: 100%; max-width: 500px; margin: 0 auto 40px; display: block; padding: 14px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; font-size: 1rem; outline: none; transition: border 0.3s; }
        .search-box:focus { border-color: #00d2ff; }
        .search-box::placeholder { color: #8892b0; }
        .providers { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .provider-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #ccc; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
        .provider-btn:hover, .provider-btn.active { background: #00d2ff; color: #000; border-color: #00d2ff; }
        .models-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .model-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; transition: transform 0.3s, border-color 0.3s; }
        .model-card:hover { transform: translateY(-5px); border-color: #00d2ff; }
        .model-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .model-provider { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; margin-bottom: 10px; }
        .provider-claude { background: rgba(217,119,87,0.2); color: #d97757; }
        .provider-gemini { background: rgba(66,133,244,0.2); color: #4285f4; }
        .provider-gpt { background: rgba(16,163,127,0.2); color: #10a37f; }
        .provider-grok { background: rgba(255,0,0,0.2); color: #ff4444; }
        .provider-deepseek { background: rgba(0,191,255,0.2); color: #00bfff; }
        .provider-muse { background: rgba(192,132,252,0.2); color: #c084fc; }
        .provider-glm { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .provider-minimax { background: rgba(34,197,94,0.2); color: #22c55e; }
        .provider-kimi { background: rgba(236,72,153,0.2); color: #ec4899; }
        .provider-qwen { background: rgba(249,115,22,0.2); color: #f97316; }
        .provider-other { background: rgba(136,146,176,0.2); color: #8892b0; }
        .model-id { color: #8892b0; font-size: 0.85rem; font-family: 'Courier New', monospace; }
        .model-meta { color: #5a6380; font-size: 0.8rem; margin-top: 8px; }
        .free-tag { display: inline-block; background: rgba(0,210,255,0.15); color: #00d2ff; padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; margin-left: 8px; }
        footer { text-align: center; margin-top: 50px; color: #5a6380; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>OpenCode AI Models</h1>
            <p class="subtitle">Explore available AI models from the OpenCode API</p>
        </header>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="totalCount">69</div>
                <div class="stat-label">Total Models</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="providerCount">11</div>
                <div class="stat-label">Providers</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="freeCount">8</div>
                <div class="stat-label">Free Models</div>
            </div>
        </div>

        <input type="text" class="search-box" id="search" placeholder="Search models...">

        <div class="providers" id="providers"></div>

        <div class="models-grid" id="models"></div>

        <footer>
            <p>Data sourced from opencode.ai/zen/v1/models</p>
        </footer>
    </div>

    <script>
        const models = [
            { id: "claude-fable-5", owned_by: "opencode" },
            { id: "claude-fable-5-1", owned_by: "opencode" },
            { id: "claude-opus-5", owned_by: "opencode" },
            { id: "claude-opus-4-8", owned_by: "opencode" },
            { id: "claude-opus-4-7", owned_by: "opencode" },
            { id: "claude-opus-4-6", owned_by: "opencode" },
            { id: "claude-opus-4-5", owned_by: "opencode" },
            { id: "claude-sonnet-5", owned_by: "opencode" },
            { id: "claude-sonnet-4-6", owned_by: "opencode" },
            { id: "claude-sonnet-4-5", owned_by: "opencode" },
            { id: "claude-sonnet-4", owned_by: "opencode" },
            { id: "claude-haiku-4-5", owned_by: "opencode" },
            { id: "gemini-3.6-flash", owned_by: "opencode" },
            { id: "gemini-3.8-flash", owned_by: "opencode" },
            { id: "gemini-3.7-flash", owned_by: "opencode" },
            { id: "gemini-3.5-flash-lite", owned_by: "opencode" },
            { id: "gemini-3.5-flash", owned_by: "opencode" },
            { id: "gemini-3.1-pro", owned_by: "opencode" },
            { id: "gemini-3-flash", owned_by: "opencode" },
            { id: "gpt-6-astra", owned_by: "opencode" },
            { id: "gpt-5.6-sol", owned_by: "opencode" },
            { id: "gpt-5.6-terra", owned_by: "opencode" },
            { id: "gpt-5.6-luna", owned_by: "opencode" },
            { id: "gpt-5.5", owned_by: "opencode" },
            { id: "gpt-5.5-pro", owned_by: "opencode" },
            { id: "gpt-5.4", owned_by: "opencode" },
            { id: "gpt-5.4-pro", owned_by: "opencode" },
            { id: "gpt-5.4-mini", owned_by: "opencode" },
            { id: "gpt-5.4-nano", owned_by: "opencode" },
            { id: "gpt-5.3-codex-spark", owned_by: "opencode" },
            { id: "gpt-5.3-codex", owned_by: "opencode" },
            { id: "gpt-5.2", owned_by: "opencode" },
            { id: "gpt-5.2-codex", owned_by: "opencode" },
            { id: "gpt-5.1", owned_by: "opencode" },
            { id: "gpt-5.1-codex-max", owned_by: "opencode" },
            { id: "gpt-5.1-codex", owned_by: "opencode" },
            { id: "gpt-5.1-codex-mini", owned_by: "opencode" },
            { id: "gpt-5", owned_by: "opencode" },
            { id: "gpt-5-codex", owned_by: "opencode" },
            { id: "gpt-5-nano", owned_by: "opencode" },
            { id: "grok-build-0.1", owned_by: "opencode" },
            { id: "grok-4.6", owned_by: "opencode" },
            { id: "grok-4.5", owned_by: "opencode" },
            { id: "muse-spark-1.3", owned_by: "opencode" },
            { id: "muse-spark-1.2", owned_by: "opencode" },
            { id: "deepseek-v4-pro", owned_by: "opencode" },
            { id: "deepseek-v4-flash", owned_by: "opencode" },
            { id: "deepseek-v4-flash-vision-exp", owned_by: "opencode" },
            { id: "glm-5.3-flash", owned_by: "opencode" },
            { id: "glm-5.3", owned_by: "opencode" },
            { id: "glm-5.2", owned_by: "opencode" },
            { id: "glm-5.1", owned_by: "opencode" },
            { id: "glm-5", owned_by: "opencode" },
            { id: "minimax-m3", owned_by: "opencode" },
            { id: "minimax-m2.7", owned_by: "opencode" },
            { id: "minimax-m2.5", owned_by: "opencode" },
            { id: "kimi-k3", owned_by: "opencode" },
            { id: "kimi-k2.7-code", owned_by: "opencode" },
            { id: "kimi-k2.6", owned_by: "opencode" },
            { id: "kimi-k2.5", owned_by: "opencode" },
            { id: "qwen3.6-plus", owned_by: "opencode" },
            { id: "qwen3.5-plus", owned_by: "opencode" },
            { id: "big-pickle", owned_by: "opencode" },
            { id: "deepseek-v4-flash-free", owned_by: "opencode" },
            { id: "muse-spark-1.3-contributor-free", owned_by: "opencode" },
            { id: "muse-spark-1.2-contributor-free", owned_by: "opencode" },
            { id: "mimo-v2.5-free", owned_by: "opencode" },
            { id: "ling-3.0-flash-fin-free", owned_by: "opencode" },
            { id: "nemotron-3-ultra-free", owned_by: "opencode" },
            { id: "nemotron-3.5-lightning-free", owned_by: "opencode" }
        ];

        function getProvider(id) {
            if (id.startsWith('claude')) return 'claude';
            if (id.startsWith('gemini')) return 'gemini';
            if (id.startsWith('gpt')) return 'gpt';
            if (id.startsWith('grok')) return 'grok';
            if (id.startsWith('deepseek')) return 'deepseek';
            if (id.startsWith('muse')) return 'muse';
            if (id.startsWith('glm')) return 'glm';
            if (id.startsWith('minimax')) return 'minimax';
            if (id.startsWith('kimi')) return 'kimi';
            if (id.startsWith('qwen')) return 'qwen';
            return 'other';
        }

        function isFree(id) { return id.includes('-free') || id === 'mimo-v2.5-free'; }

        let activeFilter = 'all';

        function renderProviders() {
            const providers = [...new Set(models.map(m => getProvider(m.id)))];
            const container = document.getElementById('providers');
            container.innerHTML = `<button class="provider-btn active" data-filter="all">All</button>` +
                providers.map(p => `<button class="provider-btn" data-filter="${p}">${p.charAt(0).toUpperCase() + p.slice(1)}</button>`).join('');
            container.querySelectorAll('.provider-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeFilter = btn.dataset.filter;
                    renderModels();
                });
            });
        }

        function renderModels() {
            const search = document.getElementById('search').value.toLowerCase();
            const filtered = models.filter(m => {
                const matchSearch = m.id.toLowerCase().includes(search);
                const matchProvider = activeFilter === 'all' || getProvider(m.id) === activeFilter;
                return matchSearch && matchProvider;
            });
            const container = document.getElementById('models');
            container.innerHTML = filtered.map(m => {
                const provider = getProvider(m.id);
                const free = isFree(m.id);
                return `<div class="model-card">
                    <div class="model-name">${m.id} ${free ? '<span class="free-tag">FREE</span>' : ''}</div>
                    <span class="model-provider provider-${provider}">${provider}</span>
                    <div class="model-id">${m.id}</div>
                    <div class="model-meta">Owned by: ${m.owned_by}</div>
                </div>`;
            }).join('');
        }

        document.getElementById('search').addEventListener('input', renderModels);
        renderProviders();
        renderModels();
    </script>
</body>
</html>
