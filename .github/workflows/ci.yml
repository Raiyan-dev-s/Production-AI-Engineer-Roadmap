name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check Project 01 (REST API)
        run: mypy projects/01-rest-api --ignore-missing-imports

      - name: Type check Project 02 (LLM App)
        run: mypy projects/02-llm-app --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (Project 01 - REST API)
        run: pytest projects/01-rest-api/tests/ -v --tb=short

      - name: Run tests (Project 02 - LLM App)
        run: pytest projects/02-llm-app/tests/ -v --tb=short

      - name: Run tests (Project 03 - RAG App)
        run: pytest projects/03-rag-app/tests/ -v --tb=short

      - name: Run tests (Project 04 - AI Agent)
        run: pytest projects/04-ai-agent/tests/ -v --tb=short

      - name: Run tests (Project 05 - Production AI System)
        run: pytest projects/05-production-ai-system/tests/ -v --tb=short
