name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: mypy .
        continue-on-error: true

      - name: Run tests (Project 01 - REST API)
        working-directory: projects/01-rest-api
        run: pytest tests/ -v --tb=short

      - name: Run tests (Project 02 - LLM App)
        working-directory: projects/02-llm-app
        run: pytest tests/ -v --tb=short

      - name: Run tests (Project 03 - RAG App)
        working-directory: projects/03-rag-app
        run: pytest tests/ -v --tb=short

      - name: Run tests (Project 04 - AI Agent)
        working-directory: projects/04-ai-agent
        run: pytest tests/ -v --tb=short

      - name: Run tests (Project 05 - Production AI System)
        working-directory: projects/05-production-ai-system
        run: pytest tests/ -v --tb=short
