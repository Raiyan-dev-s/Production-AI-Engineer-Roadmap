name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff>=0.6.0

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

  project-01:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint
        working-directory: projects/01-rest-api
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: projects/01-rest-api
        run: mypy . --ignore-missing-imports

      - name: Test
        working-directory: projects/01-rest-api
        run: pytest tests/ -v --tb=short

  project-02:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint
        working-directory: projects/02-llm-app
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: projects/02-llm-app
        run: mypy . --ignore-missing-imports

      - name: Test
        working-directory: projects/02-llm-app
        run: pytest tests/ -v --tb=short
